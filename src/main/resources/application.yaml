spring:
  application:
    name: journey
  datasource:
    url: jdbc:postgresql://localhost:5432/db_main  # Banco principal para metadados
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HikariPool
  jpa:
    hibernate:
      ddl-auto: none  # Desativar para usar apenas Liquibase
    show-sql: true
    properties:
      hibernate:
        default_schema: ${TENANT_ID:public}  # Será sobrescrito pelo TenantContext
        multi_tenant_connection_provider: com.persou.journey.employer.datasources.multitenant.SchemaBasedMultiTenantConnectionProvider
        multi_tenant_identifier_resolver: com.persou.journey.employer.datasources.multitenant.CurrentTenantIdentifierResolver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    url: jdbc:postgresql://localhost:5432/db_main
    user: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    parameters:
      schema: public
      defaultSchemaName: public